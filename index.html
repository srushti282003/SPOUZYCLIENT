<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let's Connect | Spouzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF8;--card:rgba(255,255,255,0.92);--ink:#3B234A;--ink2:#6B5A73;--ph:#8A7B91;
  --rose:#C9825B;--rose-l:#E8B99A;--blue:#2878B8;--line:#D9D9D9;--wa:#25D366;--err:#B3261E;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  color:var(--ink);font-family:var(--sans);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:#1a0a00;
  min-height:100vh;
}

/* ── FULL PAGE WEDDING BACKGROUND ── */
.page-bg{
  position:fixed;inset:0;z-index:0;
  background:url('wedding_bg.jpg') center center / cover no-repeat;
}
.page-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(255,248,240,0.35) 0%,
    rgba(255,248,240,0.10) 35%,
    rgba(0,0,0,0.08) 70%,
    rgba(0,0,0,0.22) 100%
  );
}

.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

img,video{max-width:100%;display:block}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose-l);outline-offset:3px}

/* ── HEADER with centered logo ── */
header{
  display:flex;justify-content:center;align-items:center;
  padding:8px 6% 0;
}
.logo-box{display:flex;flex-direction:column;align-items:center;gap:0}
.logo{
  width:420px;max-width:80vw;height:auto;
  opacity:0;transform-origin:center;
  animation:logoIn .8s ease-out forwards;
  filter:drop-shadow(0 4px 18px rgba(201,130,91,.4));
}
.logo-line{height:2px;width:0;background:var(--rose-l);animation:w60 .7s .6s ease-out forwards;margin-top:4px}
@keyframes logoIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes w60{to{width:60px}}

/* ── buttons ── */
.wa-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:#fff;text-decoration:none;border:0;border-radius:999px;padding:14px 26px;font-weight:500;font-size:.82rem;letter-spacing:.1em;cursor:pointer;transition:transform .25s,box-shadow .25s;will-change:transform}
.wa-btn::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s}
.wa-btn:hover::before{left:130%}
.wa-btn:hover{box-shadow:0 14px 30px -8px rgba(37,211,102,.5)}
.wa-btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.wa-btn.pulse{animation:pulse 2.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.45)}70%,100%{box-shadow:0 0 0 16px rgba(37,211,102,0)}}

.purple-btn{background:#5C2A5D;color:#fff}
.purple-btn:hover{box-shadow:0 14px 30px -8px rgba(92,42,93,.5)}
.purple-btn.pulse{animation:pulse-purple 2.8s infinite}
@keyframes pulse-purple{0%{box-shadow:0 0 0 0 rgba(92,42,93,.45)}70%,100%{box-shadow:0 0 0 16px rgba(92,42,93,0)}}

.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}

/* ── layout ── */
.main{
  display:grid;grid-template-columns:2.2fr 0.8fr;
  gap:clamp(16px,4vw,40px);
  padding:8px 6% 24px;
  max-width:1280px;margin:0 auto;width:100%;
  flex:1;
}
.divider{
  display:none;
}

/* ── glass card ── */
.card{
  position:relative;border-radius:24px;padding:2px;
  background:linear-gradient(135deg,rgba(232,185,154,.5),rgba(201,130,91,.3),rgba(232,185,154,.5));
  isolation:isolate;
  box-shadow:0 30px 70px -20px rgba(20,5,0,.5),0 0 0 1px rgba(232,185,154,.2);
}
.card::before{
  content:"";position:absolute;inset:-60%;z-index:-2;
  background:conic-gradient(from 0deg,var(--rose),var(--rose-l),rgba(255,215,0,.6),var(--rose-l),var(--rose));
  animation:spin 9s linear infinite;opacity:.45;
}
.card{overflow:hidden}
@keyframes spin{to{transform:rotate(360deg)}}
.card-in{
  position:relative;
  background:rgba(255,250,245,0.93);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:22px;
  padding:clamp(18px,3vw,30px);overflow:hidden;
}
.card-in::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(232,185,154,.25),transparent 60%);opacity:var(--so,0);transition:opacity .3s}
.progress{position:absolute;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--rose),gold);transition:width .5s cubic-bezier(.2,.7,.2,1);z-index:2}

/* form help text */
.form-help-text{font-family:var(--serif);font-size:1.4rem;font-weight:600;color:#5C2A5D;letter-spacing:.04em;margin-bottom:18px;line-height:1.3}

/* ── fields ── */
.field{position:relative;margin-bottom:20px}
.field input,.field textarea{width:100%;background:rgba(255,255,255,.85);border:1px solid rgba(201,130,91,.35);border-radius:12px;padding:26px 16px 9px;transition:border-color .25s,box-shadow .25s,transform .25s}
.field label{position:absolute;left:17px;top:19px;color:var(--ink2);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;pointer-events:none;transition:all .2s ease}
.field input::placeholder,.field textarea::placeholder{color:transparent;transition:color .25s}
.field input:focus::placeholder,.field textarea:focus::placeholder{color:var(--ph)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px rgba(201,130,91,.15);transform:translateY(-1px)}
.field input:focus+label,.field input:not(:placeholder-shown)+label,.field textarea:focus+label,.field textarea:not(:placeholder-shown)+label{top:8px;font-size:.66rem;color:var(--rose)}
.field.ok::after{content:"";position:absolute;right:16px;top:22px;width:9px;height:15px;border:solid var(--rose);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);animation:tk .35s forwards}
@keyframes tk{to{transform:rotate(45deg) scale(1)}}
.field.invalid input,.field.invalid textarea{border-color:var(--err);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.err{display:none;color:var(--err);font-size:.8rem;margin:6px 4px 0}
.field.invalid .err{display:block}

.submit{width:100%;margin-top:6px;padding:12px 18px;font-size:0.75rem}
.arrow{display:inline-block;transition:transform .25s}
.wa-btn:hover .arrow{transform:translateX(5px)}

.success{display:none;text-align:center;padding:36px 0}
.success.show{display:block;animation:fadeUp .5s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tick{width:72px;height:72px;border-radius:50%;background:rgba(232,185,154,.3);display:grid;place-items:center;margin:0 auto 20px;box-shadow:0 0 0 0 rgba(201,130,91,.4);animation:ring 1.6s .3s ease-out}
@keyframes ring{to{box-shadow:0 0 0 28px rgba(201,130,91,0)}}
.tick svg{width:30px;height:30px;stroke:var(--rose);fill:none;stroke-width:2.5;stroke-dasharray:30;stroke-dashoffset:30;animation:dr .6s .2s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.success h3{font-family:var(--serif);font-size:2rem;margin-bottom:20px}
.link{background:none;border:0;color:var(--blue);cursor:pointer;text-decoration:underline;margin-top:18px}

/* ── side / video ── */
.side{display:flex;flex-direction:column;gap:24px;height:100%}
.video{
  position:relative;border-radius:22px;overflow:hidden;
  background:rgba(20,5,0,.5);
  box-shadow:0 30px 70px -20px rgba(20,5,0,.6),0 0 0 1px rgba(232,185,154,.2);
  transition:transform .2s ease-out;transform-style:preserve-3d;
  display:flex; flex-direction:column; flex:1; min-height:0;
}
.video video{width:100%;height:100%;object-fit:cover;flex:1;}

/* Text above video (full width) */
.video-heading{
  text-align:center;
  color:#5C2A5D;
  font-family:var(--sans);
  font-size:clamp(1rem, 2.8vw, 2.2rem);
  font-weight:700;
  line-height:1.2;
  letter-spacing:0.02em;
  padding:0 6% 16px;
  max-width:1280px;
  margin:0 auto;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.vctl{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,250,245,.9);cursor:pointer;display:grid;place-items:center;z-index:11;}
.vctl svg{width:16px;height:16px;fill:var(--ink)}
.bigplay{position:absolute;inset:0;margin:auto;width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,250,245,.95);cursor:pointer;display:none;place-items:center;z-index:11;}
.bigplay::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--rose-l);animation:halo 2s infinite}
@keyframes halo{to{transform:scale(1.7);opacity:0}}
.bigplay svg{width:26px;height:26px;fill:var(--rose);margin-left:4px}
.video.needs-play .bigplay{display:grid}

/* content blocks */
.thanks-wrap{
  padding:0 6% 60px;
  max-width:1280px;
  margin:0 auto;
  width:100%;
}
.thanks{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:18px;padding:24px 26px;
  border:0;
  box-shadow:none;
  text-align:center;
}
.thanks p{color:#fff;font-size:1.35rem;font-weight:500;margin:0;letter-spacing:0.04em}

/* scroll reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* ── LOGO LOADER ── */
#loader{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:url('wedding_bg.jpg') center center / cover no-repeat;
  transition:opacity .7s ease, visibility .7s ease;
}
#loader::before{
  content:"";position:absolute;inset:0;
  background:rgba(255,248,235,0.25);
}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-logo{
  position:relative;z-index:1;
  width:800px;max-width:88vw;height:auto;
  filter:drop-shadow(0 0 32px rgba(232,185,154,.5));
  opacity:0;transform:scale(.85);
  animation:ldrIn .8s .3s cubic-bezier(.2,.7,.2,1) forwards;
}
@keyframes ldrIn{to{opacity:1;transform:scale(1)}}
.loader-ring{
  position:relative;z-index:1;
  width:52px;height:52px;border-radius:50%;
  border:3px solid rgba(232,185,154,.4);
  border-top-color:var(--rose-l);
  animation:spin .9s linear infinite;
}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  header{padding:14px 16px 8px}
  .logo{width:clamp(200px,50vw,320px)}
  .main{grid-template-columns:1fr;padding:14px 16px 50px;gap:20px}
  .divider{display:none}
  section.card{order:2} /* Form goes below on mobile */
  .side{order:1;gap:18px;height:auto} /* Video goes top on mobile */
  .video{flex:none;aspect-ratio:16/10}
  .loader-logo{width:80vw;max-width:340px}
}
@media(max-width:480px){
  header{padding:18px 14px 10px}
  .logo{width:clamp(160px,65vw,240px)}
  .main{padding:12px 14px 40px;gap:16px}
  .card-in{padding:18px 16px}
  .form-help-text{font-size:1.1rem}
  .loader-logo{width:88vw;max-width:240px}
  .thanks{padding:18px 16px}
  .video-heading{white-space:normal;font-size:clamp(1.2rem,5vw,1.8rem)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>
<body>

<!-- Wedding background -->
<div class="page-bg" aria-hidden="true"></div>

<!-- LOGO LOADER -->
<div id="loader" role="status" aria-label="Loading Spouzy">
  <img class="loader-logo" src="LOGO.png" alt="Spouzy">
  <div class="loader-ring" aria-hidden="true"></div>
</div>

<div class="wrap">
<header>
  <div class="logo-box">
    <img class="logo" src="LOGO.png" alt="Spouzy" width="420">
    <span class="logo-line"></span>
  </div>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="wa" viewBox="0 0 24 24">
    <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.3 1.3-1.8 1.3-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4Z"/>
  </symbol>
</svg>

<h2 class="video-heading rv">We&#8217;re currently refreshing our space - to serve you better</h2>
<main class="main">
  <!-- VIDEO + CONTENT (LEFT SIDE) -->
  <aside class="side">
    <div class="video rv" id="video">
      <video id="vid" muted loop playsinline preload="metadata" aria-label="Spouzy video"><source src="V1.mp4" type="video/mp4"></video>
      <button class="bigplay" id="bigplay" aria-label="Play video"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></button>
      <button class="vctl" id="vctl" aria-label="Pause video"><svg viewBox="0 0 24 24"><path id="vp" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    </div>
  </aside>

  <div class="divider" aria-hidden="true"></div>

  <!-- FORM (RIGHT SIDE) -->
  <section class="card rv" id="card" aria-label="Enquiry form">
   <div class="card-in" id="cardIn">
    <div class="progress" id="prog"></div>
    <div id="formView">
     <p class="form-help-text">NEED IMMEDIATE ASSISTANCE?</p>
     <form id="form" novalidate>
      <div class="field"><input id="name" placeholder="Enter your Name" autocomplete="name" required><label for="name">Name</label><p class="err">Please enter your name.</p></div>
      <div class="field"><input id="phone" type="tel" inputmode="tel" placeholder="Enter your WhatsApp-enabled mobile number" autocomplete="tel" required><label for="phone">Mobile number</label><p class="err">Enter a valid mobile number (10 to 13 digits).</p></div>
      <div class="field"><input id="solution" placeholder="Enter solution you wish to have" required><label for="solution">Solution you wish to have</label><p class="err">Please enter a solution.</p></div>
      <button class="wa-btn purple-btn submit pulse" type="submit">SUBMIT <span class="arrow">&#8594;</span></button>
     </form>
    </div>
    <div class="success" id="success" role="status" tabindex="-1">
      <div class="tick"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
      <h3>Thank you.</h3>
      <a class="wa-btn" id="reopen" href="#" target="_blank" rel="noopener">CONNECT ON WHATSAPP <span class="arrow">&#8594;</span></a><br>
      <button class="link" id="again" type="button">Fill the form again</button>
    </div>
   </div>
  </section>

</main>

<div class="thanks-wrap">
  <div class="thanks rv">
    <p>We sincerely apologise for the inconvenience. Please do visit us again soon.</p>
  </div>
</div>
</div>

<script>
const WA_NUMBER = "918591945055";
const $ = s => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
const base = `https://wa.me/${WA_NUMBER}`;
document.querySelectorAll("[data-wa]").forEach(a => a.href = base);

/* loader */
const loader = document.getElementById("loader");
const hideLoader = () => { if (loader && !loader.classList.contains("hidden")) loader.classList.add("hidden"); };
setTimeout(hideLoader, 3000);

/* validation */
const rules = {
  name:  v => v.trim().length >= 2,
  phone: v => { const d = v.replace(/[\s\-()+]/g,""); return /^\d{10,13}$/.test(d) && /^[+\d][\d\s\-()]*$/.test(v.trim()); },
  solution: v => v.trim().length >= 2
};
function mark(k) { const el = $("#"+k), ok = rules[k](el.value); el.parentNode.classList.toggle("ok", ok); return ok; }
Object.keys(rules).forEach(k => {
  const el = $("#"+k);
  el.addEventListener("blur",  () => el.parentNode.classList.toggle("invalid", !mark(k)));
  el.addEventListener("input", () => { if (mark(k)) el.parentNode.classList.remove("invalid"); progress(); });
});
function progress() { const n = Object.keys(rules).filter(k => rules[k]($("#"+k).value)).length; $("#prog").style.width = (n / 3 * 100) + "%"; }

/* submit */
$("#form").addEventListener("submit", e => {
  e.preventDefault(); let first = null;
  Object.keys(rules).forEach(k => { const ok = mark(k); $("#"+k).parentNode.classList.toggle("invalid", !ok); if (!ok && !first) first = $("#"+k); });
  if (first) { first.focus(); return; }
  const msg = [
    "Hello Spouzy,","Shall appreciate your solution.","",
    `Name: ${$("#name").value.trim()}`,`Mobile: ${$("#phone").value.trim()}`,`Solution required: ${$("#solution").value.trim()}`,"","Thank you."
  ].join("\n");
  const url = `${base}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank", "noopener");
  $("#reopen").href = url;
  $("#formView").style.display = "none";
  $("#success").classList.add("show");
  $("#success").focus();
});
$("#again").onclick = () => {
  $("#form").reset();
  document.querySelectorAll(".ok").forEach(n => n.classList.remove("ok"));
  progress();
  $("#success").classList.remove("show");
  $("#formView").style.display = "";
  $("#name").focus();
};

/* video */
const vid = $("#vid"), box = $("#video"), vp = $("#vp"), vctl = $("#vctl");
const PAUSE = "M6 4h4v16H6zM14 4h4v16h-4z", PLAY = "M7 4.5v15l13-7.5z";
let userPaused = false;
const sync = () => { const p = !vid.paused; vp.setAttribute("d", p ? PAUSE : PLAY); vctl.setAttribute("aria-label", p ? "Pause video" : "Play video"); box.classList.toggle("needs-play", !p && !userPaused); };
vid.addEventListener("play", sync);
vid.addEventListener("pause", sync);
const tryPlay = () => vid.play().catch(() => box.classList.add("needs-play"));
reduce ? box.classList.add("needs-play") : tryPlay();
$("#bigplay").onclick = () => { userPaused = false; vid.muted = false; tryPlay(); };
vctl.onclick = () => { if (vid.paused) { userPaused = false; tryPlay(); } else { userPaused = true; vid.pause(); } };

/* scroll reveal */
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), {threshold:.1});
document.querySelectorAll(".rv").forEach(el => io.observe(el));

if (!reduce) {
  document.addEventListener("click", e => {
    const b = e.target.closest(".wa-btn"); if (!b) return;
    const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height);
    const d = document.createElement("span"); d.className = "rip";
    d.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
    b.appendChild(d); setTimeout(() => d.remove(), 600);
  });
  if (matchMedia("(hover:hover)").matches) {
    document.querySelectorAll(".wa-btn").forEach(b => {
      b.addEventListener("mousemove", e => { const r = b.getBoundingClientRect(); b.style.transform = `translate(${(e.clientX-r.left-r.width/2)*.12}px,${(e.clientY-r.top-r.height/2)*.2-2}px)`; });
      b.addEventListener("mouseleave", () => b.style.transform = "");
    });
    const ci = $("#cardIn");
    ci.addEventListener("mousemove", e => { const r = ci.getBoundingClientRect(); ci.style.setProperty("--mx",(e.clientX-r.left)+"px"); ci.style.setProperty("--my",(e.clientY-r.top)+"px"); ci.style.setProperty("--so",1); });
    ci.addEventListener("mouseleave", () => ci.style.setProperty("--so",0));
    box.addEventListener("mousemove", e => { const r = box.getBoundingClientRect(), x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5; box.style.transform = `perspective(900px) rotateY(${x*5}deg) rotateX(${-y*5}deg)`; });
    box.addEventListener("mouseleave", () => box.style.transform = "");
  }
}
</script>
</body>
</html>
